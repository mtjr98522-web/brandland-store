<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brandland | الرئيسية</title>
<link rel="stylesheet" href="style.css">
<script defer src="app.js"></script>
</head>
<body>

<header class="top">
  <button class="menu-button" aria-label="القائمة" onclick="toggleMenu()">☰</button>
  <a class="logo" href="index.html">
    <span class="crown">♛</span> 
    <div class="logo-text">BRANDLAND</div>
  </a>
  <div class="icons">
    <a href="cart.html" class="cart-icon" title="السلة">🛒<sup class="cart-count" data-cart-count>0</sup></a>
  </div>
</header>

<main>
  <!-- البانر الرئيسي (تم ربط الصورة الجديدة وإخفاء النصوص) -->
  <section class="hero-banner">
    <img src="assets/banner-main.jpg" class="hero-image" alt="Brandland Banner">
  </section>

  <!-- مميزات المتجر -->
  <section class="features-bar">
    <div class="feature-item">
      <div class="feature-icon">🛡️</div>
      <b>دفع آمن</b>
      <small style="color:var(--text-muted)">خصوصية تامة</small>
    </div>
    <div class="feature-item">
      <div class="feature-icon">🚚</div>
      <b>شحن سريع</b>
      <small style="color:var(--text-muted)">لجميع المناطق</small>
    </div>
    <div class="feature-item">
      <div class="feature-icon">🏅</div>
      <b>منتجات أصلية</b>
      <small style="color:var(--text-muted)">جودة مضمونة</small>
    </div>
    <div class="feature-item">
      <div class="feature-icon">🎧</div>
      <b>خدمة عملاء</b>
      <small style="color:var(--text-muted)">على مدار الساعة</small>
    </div>
  </section>

  <!-- قسم المنتجات -->
  <section class="products-section">
    <div class="section-header">
      <h2>أكثر المنتجات مبيعاً</h2>
    </div>

    <!-- شبكة المنتجات -->
    <div class="products-grid" id="allProducts">
      <!-- سيتم تعبئة المنتجات هنا عبر JavaScript -->
    </div>
  </section>
</main>

<!-- القائمة السفلية للجوال -->
<nav class="bottom-nav">
  <a href="index.html" class="active"><span>🏠</span>الرئيسية</a>
  <a href="categories.html"><span>▦</span>الأقسام</a>
  <a href="cart.html"><span>🛒</span>السلة</a>
  <a href="account.html"><span>♙</span>حسابي</a>
</nav>

</body>
</html>
