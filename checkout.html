<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brandland | تأكيد الطلب</title>
<link rel="stylesheet" href="style.css">
<script defer src="app.js"></script>
</head>
<body>

<header class="top">
  <button class="menu-button" aria-label="القائمة" onclick="toggleMenu()">☰</button>
  <a class="logo" href="index.html">
    <span class="crown">♛</span> 
    <div class="logo-text">BRANDLAND</div>
  </a>
  <div class="icons">
    <a href="cart.html" class="cart-icon" title="السلة">🛒<sup class="cart-count" data-cart-count>0</sup></a>
  </div>
</header>

<main class="page">
  <!-- عنوان الصفحة -->
  <div class="section-header" style="margin-top: 20px;">
    <h2 style="font-size: 24px;">تأكيد الطلب 📋</h2>
  </div>

  <form id="checkoutForm" class="checkout-form-container" onsubmit="submitOrder(event)">
    
    <!-- قسم المعلومات الشخصية -->
    <div class="form-section">
      <div class="section-title">
        <span class="icon">👤</span> معلومات الشخصية
      </div>
      
      <div class="input-group">
        <label>الاسم الكامل</label>
        <div class="input-wrapper">
          <input type="text" name="name" required placeholder="أدخل اسمك الكامل">
          <span class="input-icon">👤</span>
        </div>
      </div>

      <div class="input-group">
        <label>رقم الجوال</label>
        <div class="input-wrapper">
          <input type="tel" name="phone" required placeholder="05xxxxxxxx">
          <span class="input-icon">📱</span>
        </div>
      </div>

      <div class="input-group">
        <label>المدينة</label>
        <div class="input-wrapper">
          <input type="text" name="city" required placeholder="أدخل مدينتك">
          <span class="input-icon">🏙️</span>
        </div>
      </div>

      <div class="input-group">
        <label>الحي</label>
        <div class="input-wrapper">
          <input type="text" name="district" required placeholder="أدخل الحي">
          <span class="input-icon">🏘️</span>
        </div>
      </div>

      <div class="input-group">
        <label>العنوان الوطني</label>
        <div class="input-wrapper">
          <input type="text" name="address" required placeholder="أدخل العنوان بالتفصيل">
          <span class="input-icon">📍</span>
        </div>
      </div>
    </div>

    <!-- قسم طريقة الدفع -->
    <div class="form-section">
      <div class="section-title">
        <span class="icon">💳</span> طريقة الدفع
      </div>
      
      <label class="payment-method">
        <div class="payment-info">
          <span class="payment-title">الدفع عند الاستلام</span>
          <span class="payment-subtitle">ادفع عند استلام الطلب</span>
        </div>
        <span class="payment-icon">💵</span>
        <input type="radio" name="payment" value="cod" checked>
        <span class="checkmark"></span>
      </label>
    </div>

    <!-- زر التأكيد -->
    <button type="submit" class="confirm-order-btn">
      <span>تأكيد الطلب</span>
      <span>❯</span>
    </button>
  </form>
</main>

<!-- القائمة السفلية للجوال -->
<nav class="bottom-nav">
  <a href="index.html"><span>🏠</span>الرئيسية</a>
  <a href="categories.html"><span>▦</span>الأقسام</a>
  <a href="cart.html"><span>🛒</span>السلة</a>
  <a href="account.html"><span>♙</span>حسابي</a>
</nav>

</body>
</html>
